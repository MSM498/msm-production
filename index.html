<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSM Produksjonsordre</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #111318;
  color: #1f2937;
}

.topbar {
  background: #0a0b0e;
  border-bottom: 4px solid #f5a623;
  padding: 20px;
}

.topbar-inner {
  max-width: 1000px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  color: white;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 1px;
}

.brand span { color: #f5a623; }

.brand-small {
  color: #9ca3af;
  font-size: 12px;
  margin-top: 4px;
}

.badge {
  background: #20232a;
  color: #d1d5db;
  padding: 8px 12px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: bold;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 22px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,.2);
}

.user-card {
  background: #20232a;
  color: white;
}

.user-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.user-label {
  color: #9ca3af;
  font-size: 11px;
  text-transform: uppercase;
  font-weight: bold;
}

.user-name {
  font-size: 20px;
  font-weight: 800;
  margin-top: 4px;
}

.change-user {
  border: 1px solid #4b5563;
  background: transparent;
  color: white;
  padding: 9px 13px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.order-title {
  margin: 0 0 5px;
  font-size: 30px;
}

.customer-name {
  color: #6b7280;
  font-size: 18px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 20px;
}

.info-box {
  background: #f5f6f8;
  padding: 14px;
  border-radius: 8px;
}

.label {
  display: block;
  color: #6b7280;
  font-size: 10px;
  text-transform: uppercase;
  font-weight: bold;
  margin-bottom: 5px;
}

.value { font-weight: bold; }

.section-title {
  margin: 0 0 15px;
  font-size: 20px;
}

.section-note {
  color: #6b7280;
  margin-top: -7px;
  margin-bottom: 16px;
  font-size: 14px;
}

.current-status {
  background: #fff4df;
  border-left: 5px solid #f5a623;
  padding: 15px;
  border-radius: 8px;
  font-weight: bold;
  margin-bottom: 18px;
}

.progress {
  display: flex;
  gap: 5px;
  margin: 18px 0;
}

.progress-step {
  flex: 1;
  height: 8px;
  background: #d1d5db;
  border-radius: 5px;
}

.progress-step.done { background: #198754; }
.progress-step.current { background: #f5a623; }

.status-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.status-button {
  border: 0;
  background: #20232a;
  color: white;
  padding: 13px 8px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.status-button:hover,
.status-button.active {
  background: #f5a623;
  color: #111;
}

/* PRODUKSJONSLØP */

.stage-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stage-option {
  position: relative;
}

.stage-option input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.stage-option label {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f5f6f8;
  border: 2px solid #e5e7eb;
  padding: 14px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
  transition: .15s;
}

.stage-option label:hover {
  border-color: #f5a623;
}

.stage-option input:checked + label {
  background: #fff4df;
  border-color: #f5a623;
}

.stage-check {
  width: 20px;
  height: 20px;
  min-width: 20px;
  border: 2px solid #9ca3af;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.stage-option input:checked + label .stage-check {
  background: #f5a623;
  border-color: #f5a623;
}

.stage-option input:checked + label .stage-check::after {
  content: "✓";
  color: #111;
  font-weight: 900;
}

.save-stages {
  margin-top: 16px;
  border: 0;
  background: #198754;
  color: white;
  padding: 13px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}

.stage-message {
  margin-top: 12px;
  font-weight: bold;
}

.lines {
  width: 100%;
  border-collapse: collapse;
}

.lines th,
.lines td {
  padding: 11px;
  text-align: left;
  border-bottom: 1px solid #e5e7eb;
}

.lines th {
  font-size: 11px;
  color: #6b7280;
  text-transform: uppercase;
}

.photo-intro {
  color: #6b7280;
  margin-top: -5px;
}

.photo-requirements {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 15px 0;
}

.requirement {
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
}

.requirement.ok {
  background: #e8f5ee;
  color: #146c43;
  border-left: 4px solid #198754;
}

.requirement.missing {
  background: #fff0f0;
  color: #a61b1b;
  border-left: 4px solid #dc3545;
}

.photo-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

.photo-box {
  background: #f5f6f8;
  border-radius: 10px;
  padding: 16px;
}

.photo-box h3 { margin: 0 0 6px; }

.photo-box p {
  color: #6b7280;
  font-size: 13px;
  min-height: 32px;
}

.photo-button {
  width: 100%;
  border: 0;
  background: #20232a;
  color: white;
  padding: 13px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.photo-button.after {
  background: #f5a623;
  color: #111;
}

.upload-status {
  margin-top: 15px;
  font-weight: bold;
}

.gallery-title {
  margin-top: 25px;
  font-size: 16px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 12px;
}

.image-card {
  background: #f5f6f8;
  border-radius: 9px;
  overflow: hidden;
}

.image-card img {
  width: 100%;
  height: 190px;
  object-fit: cover;
  display: block;
}

.image-info {
  padding: 10px;
  font-size: 12px;
  color: #6b7280;
}

.image-type {
  font-weight: bold;
  font-size: 13px;
  color: #1f2937;
  margin-bottom: 4px;
}

.history-item {
  display: flex;
  gap: 14px;
  padding: 15px 0;
  border-bottom: 1px solid #e5e7eb;
}

.history-item:last-child { border-bottom: 0; }

.history-marker {
  width: 12px;
  height: 12px;
  min-width: 12px;
  border-radius: 50%;
  background: #f5a623;
  margin-top: 5px;
}

.history-main { flex: 1; }

.history-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 5px;
}

.history-employee { font-weight: 800; }

.history-time {
  color: #6b7280;
  font-size: 12px;
  white-space: nowrap;
}

.history-change {
  color: #374151;
  font-size: 14px;
}

.history-arrow {
  color: #f5a623;
  font-weight: bold;
  padding: 0 5px;
}

.history-empty {
  background: #f5f6f8;
  color: #6b7280;
  padding: 15px;
  border-radius: 8px;
}

.message {
  display: none;
  padding: 15px;
  border-radius: 8px;
  margin: 15px 0;
  font-weight: bold;
}

.message.error {
  display: block;
  background: #fff0f0;
  color: #a61b1b;
  border-left: 5px solid #dc3545;
}

.qr-wrap {
  display: flex;
  gap: 25px;
  align-items: center;
}

.qr-wrap img {
  width: 200px;
  height: 200px;
}

.qr-text {
  color: #6b7280;
  max-width: 400px;
}

.error-card {
  background: white;
  border-radius: 12px;
  padding: 25px;
}

.footer {
  text-align: center;
  color: #6b7280;
  font-size: 11px;
  padding: 25px;
}

@media (max-width: 700px) {
  .container { padding: 12px; }
  .badge { display: none; }

  .info-grid,
  .photo-actions,
  .photo-requirements,
  .stage-selector {
    grid-template-columns: 1fr;
  }

  .status-buttons {
    grid-template-columns: repeat(2, 1fr);
  }

  .gallery { grid-template-columns: 1fr; }

  .qr-wrap { display: block; }
  .qr-wrap img { margin-bottom: 12px; }

  .history-top { display: block; }

  .history-time {
    margin-top: 3px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="brand"><span>MSM</span> PRODUKSJON</div>
      <div class="brand-small">Martin Sveis og Mekaniske AS</div>
    </div>
    <div class="badge">PRODUKSJONSORDRE</div>
  </div>
</div>

<div class="container" id="content">
  <div class="card">Laster ordre...</div>
</div>

<div class="footer">MSM Produksjonssystem</div>

<script>
const functionUrl =
  "https://xhhahusvvvsuaypqwcar.supabase.co/functions/v1/production-order";

const selectableStages = [
  "Laserskjæring",
  "Knekking",
  "Sveising",
  "Galvanisering",
  "Lakkering",
  "Pakking"
];

const oldDefaultStages = [
  "Laserskjæring",
  "Knekking",
  "Sveising",
  "Lakkering",
  "Pakking"
];

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

let currentOrder = null;

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getEmployeeName() {
  return localStorage.getItem("msm_employee_name") || "";
}

function ensureEmployeeName() {
  let name = getEmployeeName();

  if (!name) {
    name = prompt("Hvem bruker mobilen? Skriv navnet ditt:");

    if (name && name.trim()) {
      name = name.trim();
      localStorage.setItem("msm_employee_name", name);
    }
  }

  return getEmployeeName();
}

function changeEmployee() {
  const current = getEmployeeName();

  const name = prompt(
    "Skriv navnet på den som bruker mobilen:",
    current
  );

  if (name && name.trim()) {
    localStorage.setItem("msm_employee_name", name.trim());
    loadOrder();
  }
}

function formatDate(date) {
  if (!date) return "-";

  const parts = date.split("-");

  if (parts.length !== 3) return date;

  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function formatHistoryDate(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return value;

  return new Intl.DateTimeFormat("nb-NO", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function getRequiredStages(order) {
  if (Array.isArray(order.required_stages)) {
    return selectableStages.filter(stage =>
      order.required_stages.includes(stage)
    );
  }

  // Gamle ordre med NULL fortsetter som før.
  return [...oldDefaultStages];
}

function getActiveStages(order) {
  return [
    "Ordre mottatt",
    ...getRequiredStages(order),
    "Ferdig"
  ];
}

function progressHTML(status, stages) {
  const currentIndex = stages.indexOf(status);

  return stages.map((stage, index) => {
    let cls = "progress-step";

    if (currentIndex >= 0 && index < currentIndex) {
      cls += " done";
    }

    if (index === currentIndex) {
      cls += " current";
    }

    return `<div class="${cls}" title="${escapeHtml(stage)}"></div>`;
  }).join("");
}

function statusButtonsHTML(status, stages) {
  return stages.map(stage => {
    const active = stage === status ? " active" : "";

    return `
      <button
        class="status-button${active}"
        onclick='updateStatus(${JSON.stringify(stage)})'>
        ${escapeHtml(stage)}
      </button>
    `;
  }).join("");
}

function stageSelectorHTML(requiredStages) {
  return `
    <div class="stage-selector">
      ${selectableStages.map((stage, index) => {
        const checked =
          requiredStages.includes(stage) ? "checked" : "";

        return `
          <div class="stage-option">
            <input
              type="checkbox"
              id="stage-${index}"
              value="${escapeHtml(stage)}"
              ${checked}>

            <label for="stage-${index}">
              <span class="stage-check"></span>
              ${escapeHtml(stage)}
            </label>
          </div>
        `;
      }).join("")}
    </div>

    <button
      class="save-stages"
      onclick="saveRequiredStages()">
      Lagre produksjonsløp
    </button>

    <div
      id="stageMessage"
      class="stage-message">
    </div>
  `;
}

function orderLinesHTML(lines) {
  const filtered = Array.isArray(lines)
    ? lines.filter(line =>
        line.Beskrivelse ||
        line.Produkt ||
        Number(line.Nettobeløp) > 0
      )
    : [];

  if (!filtered.length) {
    return `<p>Ingen ordrelinjer registrert.</p>`;
  }

  return `
    <table class="lines">
      <thead>
        <tr>
          <th>Produkt</th>
          <th>Beskrivelse</th>
          <th>Antall</th>
          <th>Enhet</th>
        </tr>
      </thead>
      <tbody>
        ${filtered.map(line => `
          <tr>
            <td>${escapeHtml(line.Produkt || "-")}</td>
            <td>${escapeHtml(line.Beskrivelse || "-")}</td>
            <td>${escapeHtml(line.Antall ?? "-")}</td>
            <td>${escapeHtml(line.Enhet || "-")}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function photoRequirementHTML(photoStatus) {
  const before = photoStatus?.has_before;
  const after = photoStatus?.has_after;

  return `
    <div class="photo-requirements">
      <div class="requirement ${before ? "ok" : "missing"}">
        ${before
          ? "✓ Bilde før lakkering lagret"
          : "⚠ Bilde før lakkering mangler"}
      </div>

      <div class="requirement ${after ? "ok" : "missing"}">
        ${after
          ? "✓ Bilde etter lakkering lagret"
          : "⚠ Bilde etter lakkering mangler"}
      </div>
    </div>
  `;
}

function paintSectionHTML(order) {
  const requiredStages = getRequiredStages(order);

  if (!requiredStages.includes("Lakkering")) {
    return "";
  }

  return `
    <div class="card">
      <h2 class="section-title">
        Lakkering – bildedokumentasjon
      </h2>

      <p class="photo-intro">
        Både før- og etterbilde må være lagret før ordren kan
        flyttes videre til Pakking eller Ferdig.
      </p>

      ${photoRequirementHTML(order.paint_photos)}

      <div class="photo-actions">
        <div class="photo-box">
          <h3>Før lakkering</h3>
          <p>Dokumenter varen før den lakkeres.</p>

          <input
            id="beforeFile"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
            onchange="uploadImage('before', this)">

          <button
            class="photo-button"
            onclick="selectPhoto('beforeFile')">
            📷 Ta bilde før lakkering
          </button>
        </div>

        <div class="photo-box">
          <h3>Etter lakkering</h3>
          <p>Dokumenter ferdig lakkert vare.</p>

          <input
            id="afterFile"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
            onchange="uploadImage('after', this)">

          <button
            class="photo-button after"
            onclick="selectPhoto('afterFile')">
            📷 Ta bilde etter lakkering
          </button>
        </div>
      </div>

      <div
        id="uploadStatus"
        class="upload-status">
      </div>

      <div class="gallery-title">
        <strong>Lagrede bilder</strong>
      </div>

      <div id="gallery" class="gallery">
        Laster bilder...
      </div>
    </div>
  `;
}

async function loadOrder() {
  const content = document.getElementById("content");

  if (!token) {
    content.innerHTML =
      `<div class="error-card">Mangler ordre-token i lenken.</div>`;
    return;
  }

  try {
    const response = await fetch(
      functionUrl + "?token=" + encodeURIComponent(token)
    );

    if (!response.ok) throw new Error();

    const order = await response.json();

    currentOrder = order;

    const status =
      order.production_status || "Ordre mottatt";

    const employee = getEmployeeName();
    const requiredStages = getRequiredStages(order);
    const activeStages = getActiveStages(order);

    content.innerHTML = `
      <div class="card user-card">
        <div class="user-row">
          <div>
            <div class="user-label">Innlogget operatør</div>
            <div class="user-name">
              ${employee ? escapeHtml(employee) : "Ikke valgt"}
            </div>
          </div>

          <button
            class="change-user"
            onclick="changeEmployee()">
            ${employee ? "Bytt bruker" : "Velg navn"}
          </button>
        </div>
      </div>

      <div class="card">
        <h1 class="order-title">
          Ordre #${escapeHtml(order.sales_order_no)}
        </h1>

        <div class="customer-name">
          ${escapeHtml(order.customer_name || "-")}
        </div>

        <div class="info-grid">
          <div class="info-box">
            <span class="label">Prosjekt</span>
            <div class="value">
              ${escapeHtml(order.project_code || "-")}
            </div>
          </div>

          <div class="info-box">
            <span class="label">Leveringsdato</span>
            <div class="value">
              ${formatDate(order.delivery_date)}
            </div>
          </div>

          <div class="info-box">
            <span class="label">Produksjonsstatus</span>
            <div class="value">
              ${escapeHtml(status)}
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Produksjonsløp</h2>

        <p class="section-note">
          Velg bare trinnene denne ordren faktisk skal gjennom.
          Ordre mottatt og Ferdig legges til automatisk.
        </p>

        ${stageSelectorHTML(requiredStages)}
      </div>

      <div class="card">
        <h2 class="section-title">Produksjonsstatus</h2>

        <div id="statusMessage" class="message"></div>

        <div class="current-status">
          Nåværende status: ${escapeHtml(status)}
        </div>

        <div class="progress">
          ${progressHTML(status, activeStages)}
        </div>

        <div class="status-buttons">
          ${statusButtonsHTML(status, activeStages)}
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Ordrelinjer</h2>
        ${orderLinesHTML(order.order_lines)}
      </div>

      <div class="card">
        <h2 class="section-title">
          Produksjonshistorikk
        </h2>

        <div id="history">
          Laster historikk...
        </div>
      </div>

      ${paintSectionHTML(order)}

      <div class="card">
        <h2 class="section-title">QR-kode</h2>

        <div class="qr-wrap">
          <img
            src="https://quickchart.io/qr?size=220&text=${encodeURIComponent(window.location.href)}"
            alt="QR-kode">

          <div class="qr-text">
            <strong>Scan med mobilkamera</strong>

            <p>
              QR-koden åpner denne produksjonsordren direkte.
              Den kan skrives ut og følge varen gjennom produksjonen.
            </p>
          </div>
        </div>
      </div>
    `;

    loadHistory();

    if (requiredStages.includes("Lakkering")) {
      loadImages();
    }

  } catch (error) {
    console.error(error);

    content.innerHTML =
      `<div class="error-card">
        Kunne ikke hente produksjonsordren.
      </div>`;
  }
}

async function saveRequiredStages() {
  const message =
    document.getElementById("stageMessage");

  const selected = selectableStages.filter((stage, index) => {
    const checkbox =
      document.getElementById(`stage-${index}`);

    return checkbox?.checked;
  });

  message.textContent = "Lagrer...";

  try {
    const response = await fetch(
      functionUrl +
      "?token=" +
      encodeURIComponent(token) +
      "&action=stages",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          required_stages: selected
        })
      }
    );

    let result = null;

    try {
      result = await response.json();
    } catch {}

    if (!response.ok) {
      throw new Error(
        result?.error || "Kunne ikke lagre produksjonsløpet."
      );
    }

    message.textContent = "✓ Produksjonsløpet er lagret.";

    setTimeout(() => {
      loadOrder();
    }, 500);

  } catch (error) {
    console.error(error);

    message.textContent =
      "⚠ " +
      (error.message || "Kunne ikke lagre produksjonsløpet.");
  }
}

async function loadHistory() {
  const historyBox =
    document.getElementById("history");

  if (!historyBox) return;

  try {
    const response = await fetch(
      functionUrl +
      "?token=" +
      encodeURIComponent(token) +
      "&action=history"
    );

    if (!response.ok) throw new Error();

    const history = await response.json();

    if (!Array.isArray(history) || !history.length) {
      historyBox.innerHTML = `
        <div class="history-empty">
          Ingen statusendringer er registrert ennå.
        </div>
      `;
      return;
    }

    historyBox.innerHTML = `
      ${history.map(item => `
        <div class="history-item">
          <div class="history-marker"></div>

          <div class="history-main">
            <div class="history-top">
              <div class="history-employee">
                ${escapeHtml(item.employee_name || "Ukjent operatør")}
              </div>

              <div class="history-time">
                ${escapeHtml(formatHistoryDate(item.created_at))}
              </div>
            </div>

            <div class="history-change">
              ${escapeHtml(item.previous_status || "-")}
              <span class="history-arrow">→</span>
              ${escapeHtml(item.status || "-")}
            </div>
          </div>
        </div>
      `).join("")}
    `;

  } catch {
    historyBox.innerHTML = `
      <div class="history-empty">
        Kunne ikke hente produksjonshistorikken.
      </div>
    `;
  }
}

function selectPhoto(inputId) {
  const employee = ensureEmployeeName();

  if (!employee) {
    alert("Velg navn før du tar bilde.");
    loadOrder();
    return;
  }

  document.getElementById(inputId).click();
}

async function updateStatus(status) {
  const message =
    document.getElementById("statusMessage");

  const employee = ensureEmployeeName();

  if (!employee) {
    message.className = "message error";
    message.textContent =
      "⚠ Velg operatør før status endres.";
    return;
  }

  message.className = "message";
  message.textContent = "";

  try {
    const response = await fetch(
      functionUrl +
      "?token=" +
      encodeURIComponent(token),
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          status,
          employee_name: employee
        })
      }
    );

    if (!response.ok) {
      let errorText =
        "Kunne ikke oppdatere produksjonsstatus.";

      try {
        const data = await response.json();

        if (data.error) {
          errorText = data.error;
        }
      } catch {}

      message.className = "message error";
      message.textContent = "⚠ " + errorText;
      return;
    }

    await loadOrder();

  } catch {
    message.className = "message error";
    message.textContent =
      "⚠ Kunne ikke oppdatere produksjonsstatus.";
  }
}

async function uploadImage(imageType, input) {
  const file = input.files?.[0];

  const statusBox =
    document.getElementById("uploadStatus");

  if (!file || !statusBox) return;

  const employee = ensureEmployeeName();

  if (!employee) {
    statusBox.textContent =
      "Velg navn før bildet kan lagres.";

    input.value = "";
    return;
  }

  statusBox.textContent = "Laster opp bilde...";

  try {
    const formData = new FormData();

    formData.append("file", file);
    formData.append("stage", "Lakkering");
    formData.append("image_type", imageType);
    formData.append("uploaded_by", employee);

    const response = await fetch(
      functionUrl +
      "?token=" +
      encodeURIComponent(token) +
      "&action=upload-image",
      {
        method: "POST",
        body: formData
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    input.value = "";

    await loadOrder();

  } catch (error) {
    console.error(error);

    statusBox.textContent =
      "Kunne ikke laste opp bildet.";
  }
}

async function loadImages() {
  const gallery =
    document.getElementById("gallery");

  if (!gallery) return;

  try {
    const response = await fetch(
      functionUrl +
      "?token=" +
      encodeURIComponent(token) +
      "&action=images"
    );

    if (!response.ok) throw new Error();

    const images = await response.json();

    if (!Array.isArray(images) || !images.length) {
      gallery.innerHTML =
        `<div>Ingen bilder lagret ennå.</div>`;
      return;
    }

    gallery.innerHTML =
      images.map(image => {
        const typeText =
          image.image_type === "before"
            ? "Før lakkering"
            : "Etter lakkering";

        if (!image.image_url) {
          return `
            <div class="image-card">
              <div class="image-info">
                <div class="image-type">${typeText}</div>
                Bildet kunne ikke vises.
              </div>
            </div>
          `;
        }

        return `
          <div class="image-card">
            <img
              src="${image.image_url}"
              alt="${typeText}">

            <div class="image-info">
              <div class="image-type">
                ${typeText}
              </div>

              ${escapeHtml(image.stage || "")}

              ${image.uploaded_by
                ? `<br>📷 ${escapeHtml(image.uploaded_by)}`
                : ""}
            </div>
          </div>
        `;
      }).join("");

  } catch {
    gallery.innerHTML =
      `<div>Kunne ikke hente bilder.</div>`;
  }
}

loadOrder();
</script>
