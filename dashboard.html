<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSM Produksjon – TV</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101216;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
  height: 90px;
  background: #090a0d;
  border-bottom: 5px solid #f5a623;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 35px;
}

.logo {
  font-size: 31px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  color: #f5a623;
}

.subtitle {
  color: #9ca3af;
  font-size: 13px;
  margin-top: 4px;
}

.header-right {
  text-align: right;
}

.clock {
  font-size: 28px;
  font-weight: 800;
}

.updated {
  color: #9ca3af;
  font-size: 12px;
  margin-top: 3px;
}

/* HOVEDINNHOLD */

main {
  padding: 22px 28px 30px;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 17px;
}

h1 {
  margin: 0;
  font-size: 22px;
}

.order-count {
  color: #9ca3af;
  font-size: 14px;
}

/* ORDREGRID */

.orders {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

/* ORDREKORT */

.order {
  position: relative;
  background: #1d2026;
  border: 1px solid #30343c;
  border-radius: 13px;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px;
  min-height: 205px;
}

/* HASTER */

.order.priority-urgent {
  border: 2px solid #f5a623;
  box-shadow: 0 0 18px rgba(245, 166, 35, .18);
}

/* STOPP */

.order.priority-stop {
  border: 2px solid #dc3545;
  opacity: .82;
}

/* PRIORITETSBANNER */

.priority-banner {
  position: absolute;
  top: 0;
  right: 150px;
  padding: 6px 12px;
  border-radius: 0 0 0 8px;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .4px;
  z-index: 2;
}

.priority-banner.urgent {
  background: #f5a623;
  color: #111;
}

.priority-banner.stop {
  background: #dc3545;
  color: white;
}

/* ORDREINNHOLD */

.order-main {
  padding: 18px 20px;
}

.order-number {
  color: #f5a623;
  font-size: 14px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.customer {
  font-size: 23px;
  font-weight: 900;
  margin-bottom: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.description {
  color: #c5c9d0;
  font-size: 14px;
  min-height: 20px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* META */

.meta {
  display: flex;
  gap: 20px;
  margin-top: 14px;
  align-items: center;
  flex-wrap: wrap;
}

.meta-label {
  color: #7f8792;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  margin-bottom: 3px;
}

.meta-value {
  font-size: 14px;
  font-weight: 800;
}

/* STATUS */

.status {
  display: inline-block;
  background: #f5a623;
  color: #111;
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 900;
}

.status.finished {
  background: #198754;
  color: white;
}

/* FREMDRIFT */

.progress {
  display: flex;
  gap: 4px;
  margin-top: 16px;
}

.progress-part {
  height: 7px;
  flex: 1;
  background: #3a3f48;
  border-radius: 4px;
}

.progress-part.done {
  background: #198754;
}

.progress-part.current {
  background: #f5a623;
}

/* QR */

.qr-area {
  background: white;
  color: #111;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 10px;
}

.qr {
  width: 120px;
  height: 120px;
}

.qr img,
.qr canvas {
  width: 120px !important;
  height: 120px !important;
}

.scan-text {
  margin-top: 7px;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  text-align: center;
}

/* TOM / FEIL */

.empty,
.error {
  grid-column: 1 / -1;
  background: #1d2026;
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  color: #9ca3af;
  font-size: 18px;
}

.error {
  color: #ff8a8a;
}

/* STORE TV-ER */

@media (min-width: 1500px) {

  .orders {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

}

/* SMÅ SKJERMER */

@media (max-width: 900px) {

  .orders {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header>

  <div>

    <div class="logo">
      <span>MSM</span> PRODUKSJON
    </div>

    <div class="subtitle">
      Martin Sveis og Mekaniske AS
    </div>

  </div>

  <div class="header-right">

    <div
      id="clock"
      class="clock">
    </div>

    <div
      id="updated"
      class="updated">
      Henter produksjonsplan...
    </div>

  </div>

</header>

<main>

  <div class="top-row">

    <h1>
      Aktive produksjonsordre
    </h1>

    <div
      id="orderCount"
      class="order-count">
    </div>

  </div>

  <div
    id="orders"
    class="orders">

    <div class="empty">
      Laster ordre...
    </div>

  </div>

</main>

<script>

/* =========================================================
   OPPSETT
========================================================= */

const functionUrl =
  "https://xhhahusvvvsuaypqwcar.supabase.co/functions/v1/production-order";

const orderPage =
  "https://msm498.github.io/msm-production/";

const defaultStages = [
  "Ordre mottatt",
  "Laserskjæring",
  "Knekking",
  "Sveising",
  "Lakkering",
  "Pakking",
  "Ferdig"
];

/* =========================================================
   HJELPEFUNKSJONER
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatDate(value) {

  if (!value) {
    return "-";
  }

  const parts =
    value.split("-");

  if (parts.length !== 3) {
    return value;
  }

  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

/* =========================================================
   PRODUKSJONSLØP
========================================================= */

function getStages(order) {

  if (
    Array.isArray(order.required_stages)
  ) {

    return [
      "Ordre mottatt",
      ...order.required_stages,
      "Ferdig"
    ];
  }

  return defaultStages;
}

function progressHtml(order) {

  const stages =
    getStages(order);

  const current =
    stages.indexOf(
      order.production_status ||
      "Ordre mottatt"
    );

  return stages.map(
    (stage, index) => {

      let css =
        "progress-part";

      if (
        current >= 0 &&
        index < current
      ) {
        css += " done";
      }

      if (index === current) {
        css += " current";
      }

      return `
        <div
          class="${css}"
          title="${escapeHtml(stage)}">
        </div>
      `;

    }
  ).join("");
}

/* =========================================================
   BESKRIVELSE
========================================================= */

function getDescription(order) {

  if (
    !Array.isArray(order.order_lines)
  ) {
    return "";
  }

  const descriptions =
    order.order_lines
      .map(line =>
        line.Beskrivelse ||
        line.Produkt ||
        ""
      )
      .filter(Boolean);

  return descriptions
    .slice(0, 2)
    .join(" · ");
}

/* =========================================================
   PRIORITERING
========================================================= */

function getPriority(order) {

  if (
    order.priority === "Haster" ||
    order.priority === "Stopp/venter"
  ) {
    return order.priority;
  }

  return "Normal";
}

function priorityWeight(priority) {

  if (priority === "Haster") {
    return 0;
  }

  if (priority === "Normal") {
    return 1;
  }

  if (priority === "Stopp/venter") {
    return 2;
  }

  return 1;
}

function priorityCardClass(priority) {

  if (priority === "Haster") {
    return " priority-urgent";
  }

  if (priority === "Stopp/venter") {
    return " priority-stop";
  }

  return "";
}

function priorityBanner(priority) {

  if (priority === "Haster") {

    return `
      <div class="priority-banner urgent">
        ⚡ HASTER
      </div>
    `;
  }

  if (priority === "Stopp/venter") {

    return `
      <div class="priority-banner stop">
        ⛔ STOPP / VENTER
      </div>
    `;
  }

  return "";
}

/* =========================================================
   SORTERING
========================================================= */

function sortOrders(a, b) {

  const priorityA =
    getPriority(a);

  const priorityB =
    getPriority(b);

  const priorityDifference =
    priorityWeight(priorityA) -
    priorityWeight(priorityB);

  /*
    Prioritet bestemmer først.
  */

  if (priorityDifference !== 0) {
    return priorityDifference;
  }

  /*
    Innen samme prioritet kommer
    tidligste leveringsdato først.
  */

  if (
    !a.delivery_date &&
    !b.delivery_date
  ) {
    return 0;
  }

  if (!a.delivery_date) {
    return 1;
  }

  if (!b.delivery_date) {
    return -1;
  }

  return a.delivery_date.localeCompare(
    b.delivery_date
  );
}

/* =========================================================
   QR
========================================================= */

function createQR(element, url) {

  element.innerHTML = "";

  new QRCode(element, {
    text: url,
    width: 120,
    height: 120,
    correctLevel:
      QRCode.CorrectLevel.M
  });
}

/* =========================================================
   HENT ORDRE
========================================================= */

async function loadOrders() {

  const container =
    document.getElementById(
      "orders"
    );

  try {

    const response = await fetch(
      functionUrl + "?view=orders",
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error();
    }

    let orders =
      await response.json();

    if (!Array.isArray(orders)) {
      throw new Error();
    }

    /*
      Ferdige ordre vises ikke
      på produksjonstavla.
    */

    orders =
      orders.filter(order =>
        order.production_status !==
        "Ferdig"
      );

    /*
      PRIORITERING:

      1. Haster
      2. Normal
      3. Stopp/venter

      Innen gruppene:
      tidligste levering først.
    */

    orders.sort(sortOrders);

    const urgentCount =
      orders.filter(order =>
        getPriority(order) ===
        "Haster"
      ).length;

    const stopCount =
      orders.filter(order =>
        getPriority(order) ===
        "Stopp/venter"
      ).length;

    let countText =
      `${orders.length} aktive ordre`;

    if (urgentCount > 0) {
      countText +=
        ` · ⚡ ${urgentCount} haster`;
    }

    if (stopCount > 0) {
      countText +=
        ` · ⛔ ${stopCount} venter`;
    }

    document.getElementById(
      "orderCount"
    ).textContent =
      countText;

    if (!orders.length) {

      container.innerHTML = `
        <div class="empty">
          Ingen aktive produksjonsordre.
        </div>
      `;

      return;
    }

    /* =====================================================
       BYGG ORDREKORT
    ===================================================== */

    container.innerHTML =
      orders.map(
        (order, index) => {

          const status =
            order.production_status ||
            "Ordre mottatt";

          const priority =
            getPriority(order);

          const finished =
            status === "Ferdig"
              ? " finished"
              : "";

          const cardClass =
            priorityCardClass(
              priority
            );

          return `

            <div class="order${cardClass}">

              ${priorityBanner(priority)}

              <div class="order-main">

                <div class="order-number">
                  Ordre #${escapeHtml(
                    order.sales_order_no
                  )}
                </div>

                <div class="customer">
                  ${escapeHtml(
                    order.customer_name ||
                    "-"
                  )}
                </div>

                <div class="description">
                  ${escapeHtml(
                    getDescription(order) ||
                    "Produksjonsordre"
                  )}
                </div>

                <div class="meta">

                  <div>

                    <div class="meta-label">
                      Status
                    </div>

                    <div
                      class="status${finished}">
                      ${escapeHtml(status)}
                    </div>

                  </div>

                  <div>

                    <div class="meta-label">
                      Levering
                    </div>

                    <div class="meta-value">
                      ${formatDate(
                        order.delivery_date
                      )}
                    </div>

                  </div>

                  <div>

                    <div class="meta-label">
                      Prosjekt
                    </div>

                    <div class="meta-value">
                      ${escapeHtml(
                        order.project_code ||
                        "-"
                      )}
                    </div>

                  </div>

                </div>

                <div class="progress">
                  ${progressHtml(order)}
                </div>

              </div>


              <div class="qr-area">

                <div
                  class="qr"
                  id="qr-${index}">
                </div>

                <div class="scan-text">
                  Scan for ordre
                </div>

              </div>

            </div>
          `;

        }
      ).join("");

    /* =====================================================
       LAG QR-KODER
    ===================================================== */

    orders.forEach(
      (order, index) => {

        const qrElement =
          document.getElementById(
            `qr-${index}`
          );

        if (!qrElement) {
          return;
        }

        const url =
          orderPage +
          "?token=" +
          encodeURIComponent(
            order.portal_token
          );

        createQR(
          qrElement,
          url
        );
      }
    );

    /* =====================================================
       SIST OPPDATERT
    ===================================================== */

    const now =
      new Date();

    document.getElementById(
      "updated"
    ).textContent =
      "Oppdatert " +
      now.toLocaleTimeString(
        "nb-NO",
        {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      );

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="error">
        Kunne ikke hente produksjonsordre.
      </div>
    `;
  }
}

/* =========================================================
   KLOKKE
========================================================= */

function updateClock() {

  const now =
    new Date();

  document.getElementById(
    "clock"
  ).textContent =
    now.toLocaleTimeString(
      "nb-NO",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );
}

/* =========================================================
   START
========================================================= */

updateClock();
loadOrders();

setInterval(
  updateClock,
  1000
);

/*
  Produksjonstavla henter nye data
  hvert 30. sekund.
*/

setInterval(
  loadOrders,
  30000
);

</script>

</body>
</html>
